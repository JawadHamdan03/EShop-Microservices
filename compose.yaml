services:

  catalogDb:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: CatalogDb
      POSTGRES_USER: ${CATALOG_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - catalogdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER:-postgres} -d CatalogDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog.api:
    image: catalog.api
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 5000
      ConnectionStrings__Database: "Host=catalogDb;Port=5432;Database=CatalogDb;Username=${CATALOG_DB_USER:-postgres};Password=${CATALOG_DB_PASSWORD:-postgres};Include Error Detail=true"
    ports:
      - "5000:5000"
    depends_on:
      catalogDb:
        condition: service_healthy

volumes:
  catalogdb_data:
