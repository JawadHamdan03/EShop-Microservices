services:

  catalogDb:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: CatalogDb
      POSTGRES_USER: ${CATALOG_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - catalogdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER:-postgres} -d CatalogDb"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  basketDb:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: BasketDb
      POSTGRES_USER: ${BASKET_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BASKET_DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - basketdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BASKET_DB_USER:-postgres} -d BasketDb"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  distributedcache:
    image: redis
    container_name: distributedcache
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    
  
  catalog.api:
    image: catalog.api
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 5050
      ConnectionStrings__Database: "Host=catalogDb;Port=5432;Database=CatalogDb;Username=${CATALOG_DB_USER:-postgres};Password=${CATALOG_DB_PASSWORD:-postgres};Include Error Detail=true"
    ports:
      - "5050:5050"
    depends_on:
      catalogDb:
        condition: service_healthy
     
  basket.api:
    image: basket.api
    build:
      context: .
      dockerfile: src/Services/Basket/Basket.API/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 5051
      ConnectionStrings__Database: "Host=basketDb;Port=5432;Database=BasketDb;Username=${BASKET_DB_USER:-postgres};Password=${BASKET_DB_PASSWORD:-postgres};Include Error Detail=true"
      ConnectionStrings__Redis: "distributedcache:6379"
      GrpcSettings__DiscountUrl: "http://host.docker.internal:5052"
    ports:
      - "5051:5051"
    depends_on:
      basketDb:
        condition: service_healthy
      distributedcache:
        condition: service_healthy
      discount.grpc:
        condition: service_started
      
  discount.grpc:
    image: discount.grpc
    build:
      context: .
      dockerfile: src/Services/Discount/Discount.Grpc/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 5052
      ConnectionStrings__Database: "Data Source=discountdb"
    ports:
      - "5052:5052"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro



volumes:
  catalogdb_data:
  basketdb_data:  
